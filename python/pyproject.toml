[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yantra-diagrams"
version = "1.0.0"
description = "Build Yantra step-by-step diagrams and one-page answers from Python; compiled to single offline HTML files by the Yantra CLI (Node.js >= 18)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "niyankhadka" }]
keywords = ["diagram", "diagrams", "architecture", "sequence diagram", "flowchart", "walkthrough", "visualization", "html", "mermaid", "drawio", "plantuml"]
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Topic :: Documentation",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Software Development :: Documentation",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/niyankhadka/yantra"
Documentation = "https://github.com/niyankhadka/yantra/blob/main/python/README.md"
Source = "https://github.com/niyankhadka/yantra"
Issues = "https://github.com/niyankhadka/yantra/issues"
Changelog = "https://github.com/niyankhadka/yantra/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["yantra"]
