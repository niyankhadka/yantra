[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "niyankhadka-yantra"
version = "1.2.0"
description = "Build Yantra diagrams, answer pages and books from Python: explanations readers step through, validated and built by the Yantra CLI (Node.js >= 20.19)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "niyankhadka" }]
keywords = ["diagram", "architecture diagram", "sequence diagram", "flowchart", "er diagram", "state machine", "mind map", "interactive", "walkthrough", "documentation", "mermaid", "plantuml", "drawio", "svg", "html", "offline"]
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Topic :: Documentation",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Software Development :: Documentation",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://yantra.nbk.com.np/"
Documentation = "https://yantra.nbk.com.np/docs/guides/python/"
Source = "https://github.com/niyankhadka/yantra"
Issues = "https://github.com/niyankhadka/yantra/issues"
Changelog = "https://yantra.nbk.com.np/docs/changelog/"
Funding = "https://buymeacoffee.com/niyankhadka"

[tool.setuptools]
packages = ["yantra"]
