version: 2
# Update pull requests go to dev, then reach main with the next release merge
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /python
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
