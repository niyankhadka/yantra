name: Release

# Publishes to npm and PyPI when a version tag (v1.2.3) is pushed. Never runs on branch pushes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - name: Python SDK tests
        run: |
          python -m pip install -e python/
          python -B -m unittest discover -s python/tests -v
      - name: Tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          node -e "const v=require('./package.json').version; if (v !== process.argv[1]) { console.error('package.json is ' + v); process.exit(1) }" "$tag"
          grep -q "^version = \"$tag\"" python/pyproject.toml || { echo "python/pyproject.toml version differs from $tag"; exit 1; }

  npm:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm publish --provenance --access public # prepack builds the viewer into dist/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build python/ --outdir dist-python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-python
