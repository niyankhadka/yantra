name: Pages

# Builds the website (site/ and playground/, `npm run build:site`) and deploys it to
# GitHub Pages (Settings > Pages > Source: GitHub Actions). Runs on pushes to main and by
# hand only (never on pull requests) and publishes no packages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: the sitemap and docs pages date each page by its last commit
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v6
      - name: Build the site into dist-pages/
        run: npm run build:site
        env:
          # Optional search-engine ownership checks (Settings > Secrets and variables >
          # Actions > Variables). Unset: no verification meta tag is written.
          YANTRA_SITE_GOOGLE_VERIFICATION: ${{ vars.YANTRA_SITE_GOOGLE_VERIFICATION }}
          YANTRA_SITE_BING_VERIFICATION: ${{ vars.YANTRA_SITE_BING_VERIFICATION }}
          # Optional Google Tag Manager container (GTM-XXXXXXX) holding the GA4 and Clarity tags,
          # behind a consent banner. Unset: the site loads no analytics.
          YANTRA_SITE_GTM_ID: ${{ vars.YANTRA_SITE_GTM_ID }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
