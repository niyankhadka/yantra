name: Pages

# Builds the playground (playground/, `npm run build:playground`) and deploys it to
# GitHub Pages (Settings > Pages > Source: GitHub Actions). Runs on pushes to main and by
# hand only (never on pull requests) and publishes no packages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build playground
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      - name: Build the playground into dist-pages/
        run: npm run build:playground
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
