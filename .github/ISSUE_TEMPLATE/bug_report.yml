name: Bug report
description: Something renders wrongly, fails to validate, or crashes.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Payload or source to reproduce
      description: The smallest diagram JSON, page, Mermaid, draw.io or PlantUML input that shows the problem. Remove anything confidential.
      render: json
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: yantra build diagram.json
  - type: input
    id: version
    attributes:
      label: Yantra version
      placeholder: 1.0.0 (or a commit hash)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Node 22, Windows 11, Chrome 130 / Python 3.12
