name: Feature request
description: Suggest a new capability, block type, importer or option.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to explain or build, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work, ideally with an example payload or source snippet.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
